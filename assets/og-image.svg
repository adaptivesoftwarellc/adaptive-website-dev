<?xml version="1.0" encoding="UTF-8"?>
<!--
  Social share card (OG/Twitter). Built separately from the brand SVG on
  purpose: the brand SVG's wordmark is set in Pepi, a licensed font that
  isn't embedded and won't render on the machine that rasterizes this
  (see assets/mark.svg's own comment / index.html's wordmark note). This
  card uses system sans/serif stacks that any renderer already has, so
  the checked-in PNG always matches what's designed here.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#063954"/>
      <stop offset="1" stop-color="#10232D"/>
    </linearGradient>
    <linearGradient id="m-g1" x1="33.17" y1="13.61" x2="66.77" y2="27.81" gradientUnits="userSpaceOnUse">
      <stop offset=".23" stop-color="#158098"/>
      <stop offset="1" stop-color="#3bb7c9"/>
    </linearGradient>
    <linearGradient id="m-g2" x1="0" y1="71.49" x2="42.36" y2="71.49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#063954"/>
      <stop offset="1" stop-color="#209bd1"/>
    </linearGradient>
    <clipPath id="m-clip1">
      <path d="M82.76,73.21h-26.83l-13.41,23.23,13.41,23.23h.05l-.03.03-.02-.03h-26.83l-13.41,23.23,13.41,23.23h26.83l13.41-23.23-.04-.06,13.39-23.18h.06l13.41-23.23-13.41-23.23ZM67.68,119.82l-.18-.14h.26l-.07.14Z"/>
    </clipPath>
    <linearGradient id="m-g3" x1="-2897.64" y1="-870.66" x2="-2817.88" y2="-870.66" gradientTransform="translate(2906.14 990.48)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a9678"/>
      <stop offset=".52" stop-color="#45b38e"/>
      <stop offset=".97" stop-color="#00b884"/>
    </linearGradient>
    <clipPath id="m-clip2">
      <path d="M82.76,73.35h-26.83l-13.41,23.23,13.41,23.23h.05l-.03.03-.02-.03h-26.83l-13.41,23.23,13.41,23.23h26.83l13.41-23.23-.04-.06,13.39-23.18h.06l13.41-23.23-13.41-23.23ZM67.68,119.95l-.18-.14h.26l-.07.14Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark -->
  <g transform="translate(90,60) scale(0.9)">
    <polygon fill="url(#m-g1)" points="69.35 0 82.76 23.23 69.35 46.47 42.52 46.47 29.11 23.23 42.52 0 69.35 0"/>
    <polygon fill="url(#m-g2)" points="42.36 46.47 14.45 46.47 0 71.49 14.45 96.52 42.36 96.52 27.91 71.49 42.36 46.47"/>
    <g clip-path="url(#m-clip1)">
      <rect fill="url(#m-g3)" x="-25.03" y="62.77" width="151.49" height="114.09" transform="translate(176.96 88.35) rotate(98.95)"/>
    </g>
    <g clip-path="url(#m-clip2)">
      <rect fill="url(#m-g3)" x="-19.81" y="78.35" width="151.49" height="114.09" transform="translate(198.39 101.19) rotate(98.95)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="220" y="150" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F3EE">Adaptive<tspan font-weight="300" fill="#B7BDBA">Software</tspan></text>

  <!-- label -->
  <text x="90" y="270" font-family="'JetBrains Mono', Courier, monospace" font-size="22" letter-spacing="1" fill="#00B884">CUSTOM SOFTWARE · DATA &amp; WORKFLOW</text>

  <!-- headline -->
  <text x="88" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#EDEAE3">One system instead</text>
  <text x="88" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#EDEAE3">of six.</text>

  <!-- rule -->
  <rect x="90" y="500" width="1020" height="2" fill="#12506F"/>

  <text x="90" y="546" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#B7BDBA">adaptivesoftwarellc.com</text>
</svg>
